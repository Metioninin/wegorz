services:
  db:
    hostname: db
    image: postgres:17.5
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=postgres
    volumes:
      - ${PWD}/.db-data/:/var/lib/postgresql/data/
      - ${PWD}/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks: 
      - db-net
      
  api:
    build:
      context: ${PWD}/api/
      dockerfile: Containerfile
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=postgres
      - POSTGRES_HOST=db
    volumes:
      - ${PWD}/api/:/api
    networks:
      - db-net
    ports:
      - "8000:8000"
    depends_on:
      - db

networks:
  db-net:
    driver: bridge