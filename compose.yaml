services:
  db:
    hostname: db
    image: postgres:17.5
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=postgres
    volumes:
      - ${PWD}/.db-data/:/var/lib/postgresql/data/
      - ${PWD}/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks: 
      - db-net
      
  api:
    build:
      context: ${PWD}/api/
      dockerfile: Containerfile
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=postgres
      - POSTGRES_HOST=db
    volumes:
      - ${PWD}/api/:/api
    networks:
      - db-net
      - app-net
    depends_on:
      - db

  nginx:
    image: docker.io/nginx:latest
    restart: unless-stopped
    volumes:
      - ${PWD}/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${PWD}/.logs:/etc/nginx/logs
      - /etc/ssl/certs/wegorz.pem:/etc/nginx/cert.pem:ro
      - /etc/ssl/private/wegorz.key:/etc/nginx/cert.key:ro
    networks:
      - app-net
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api


networks:
  db-net:
    driver: bridge
  app-net:
    driver: bridge