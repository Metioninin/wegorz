{% if round %}
<div id="contest-timer" class="timer-container" style="display: none;">
    <div id="progress-container" class="progress-container" style="display: none;">
        <div id="progress-bar" class="progress-bar" style="transition: width 0.05s linear;"></div>
    </div>
    <div id="timer-text" class="timer-text"></div>
</div>

<script>
(function() {
    const startsAt = new Date("{{ round.starts_at.isoformat() }}").getTime();
    const endsAt = new Date("{{ round.ends_at.isoformat() }}").getTime();
    const timerContainer = document.getElementById('contest-timer');
    const timerText = document.getElementById('timer-text');
    const progressContainer = document.getElementById('progress-container');
    const progressBar = document.getElementById('progress-bar');
    
    // Check if the page was loaded before the contest started
    const loadedBeforeStart = new Date().getTime() < startsAt;

    function updateTimer() {
        const now = new Date().getTime();
        
        if (now < startsAt) {
            // Before contest
            timerContainer.style.display = 'block';
            const diff = startsAt - now;
            timerText.textContent = formatDiff(diff) + " do rozpoczęcia {{ round.title }}";
            progressContainer.style.display = 'none';
        } else if (loadedBeforeStart && now < endsAt) {
            // Contest started while the user was already on the page
            timerContainer.style.display = 'block';
            timerText.textContent = "Runda wystartowała. Odśwież stronę.";
            progressContainer.style.display = 'none';
            clearInterval(interval);
        } else if (now < endsAt) {
            // During contest (page loaded after start)
            timerContainer.style.display = 'block';
            progressContainer.style.display = 'block';
            const diff = endsAt - now;
            timerText.textContent = formatDiff(diff) + " do końca {{ round.title }}";
            
            const total = endsAt - startsAt;
            const elapsed = Math.min(now - startsAt, total);
            const percentage = (elapsed / total) * 100;
            progressBar.style.width = percentage + '%';
            
            // Pastel Color: Green (120) to Red (0)
            const hue = 120 * (1 - (percentage / 100));
            progressBar.style.backgroundColor = `hsl(${hue}, 95%, 85%)`;
        } else {
            // After contest
            const justFinished = (now - endsAt) < 5000;
            if (justFinished) {
                timerContainer.style.display = 'block';
                timerText.textContent = "Runda się zakończyła. Odśwież stronę.";
                progressContainer.style.display = 'block';
                progressBar.style.width = '100%';
                progressBar.style.backgroundColor = `hsl(0, 95%, 85%)`;
            } else {
                timerContainer.style.display = 'none';
            }
            clearInterval(interval);
        }
    }

    function formatDiff(ms) {
        const days = Math.floor(ms / (1000 * 60 * 60 * 24));
        const hours = Math.floor((ms % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((ms % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.ceil((ms % (1000 * 60)) / 1000);

        let res = "";
        if (days > 0) res += days + " dni ";
        if (hours > 0 || days > 0) res += hours + " godzin ";
        if (minutes > 0 || hours > 0 || days > 0) res += minutes + " minut ";
        res += seconds + " sekund";
        return res;
    }

    updateTimer();
    const interval = setInterval(updateTimer, 50);
})();
</script>
{% endif %}
