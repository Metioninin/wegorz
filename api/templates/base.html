<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ website }}{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link id="favicon" rel="icon" type="image/x-icon" href="static/favicon/favicon.ico">
    {% block head %}{% endblock %}
</head>
<body>
    {% if round %}
    <header>
        <nav>
            <a href="/" style="font-size: 1.25rem; font-weight: 700; color: var(--primary-color);">{{ website }}</a>
            <div style="display: flex; gap: 1.5rem; align-items: center;">
                <a href="/submit">Zgłoś rozwiązanie</a>
                <a href="/change-password">Zmień hasło</a>
                <form action="/logout" method="POST" style="display:inline; margin: 0;">
                    <button type="submit" style="padding: 0.5rem 1rem; font-size: 0.875rem;">Wyloguj</button>
                </form>
            </div>
        </nav>
        {% include 'timer.html' %}
    </header>
    {% endif %}

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
