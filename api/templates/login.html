<!DOCTYPE html>
<html>
<head>
    <title>Logowanie</title>
</head>
<body>
    <h1>Logowanie</h1>
    <form method="post">
        <input type="text" name="login" placeholder="Login" required><br>
        <input type="password" name="password" placeholder="Hasło" required><br>
        <button type="submit">Zaloguj</button>
    </form>
    {% if error %}
        <p style="color:red">{{ error }}</p>
    {% endif %}
</body>
</html>
