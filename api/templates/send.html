<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Code Submission</title>
</head>
<body>
  <h1>Code Submission</h1>

  <form method="POST" action="/submit" enctype="multipart/form-data">
    <p>
      <label><b>Language:</b></label><br>
      <label><input type="radio" name="lang" value="CPP" checked> C++</label>
      &nbsp;
      <label><input type="radio" name="lang" value="PY"> Python</label>
    </p>

    <p>
      <label for="fileInput"><b>Upload a file:</b></label><br>
      <input type="file" id="fileInput" name="file" onchange="loadFile(event)">
    </p>

    <p>
      <label for="code"><b>Or paste code here:</b></label><br>
      <textarea id="code" name="code" rows="15" cols="80" placeholder="Paste your code here..."></textarea>
    </p>

    <p>
      <button type="submit">Submit</button>
        {% if error %}
            <p style="color:red">{{ error }}</p>
        {% endif %}
    </p>
  </form>
  
  <p><a href="/">Wróć</a></p>

  <script>
    function loadFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        document.getElementById('code').value = ev.target.result;
      };
      reader.onerror = () => alert('Could not read file.');
      reader.readAsText(file);
    }
  </script>
</body>
</html>
