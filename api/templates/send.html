{% extends "base.html" %}

{% block title %}Zgłoś rozwiązanie - {{ website }}{% endblock %}

{% block head %}
    <style>
        textarea:disabled {
            background-color: #f1f5f9;
            color: #94a3b8;
            cursor: not-allowed;
            border-color: #e2e8f0;
        }
        .file-input-wrapper {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
        }
        #file-name-info {
            font-size: 0.875rem;
            color: var(--primary-color);
            font-weight: 500;
            display: none;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 250px;
        }
    </style>
{% endblock %}

{% block content %}

    <div class="card">
        <h1>Zgłoś rozwiązanie</h1>
        <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Zostało ci {{ subms_left }} zgłoszeń</p>

        <form method="POST" action="/submit" onsubmit="return prepareSubmit(event)">
            <div class="form-group">
                <label>Język programowania</label>
                <div style="display: flex; gap: 1.5rem; margin-top: 0.5rem;">
                    <label style="display: flex; align-items: center; gap: 0.5rem; font-weight: 400; color: var(--text-color); cursor: pointer;">
                        <input type="radio" name="lang" value="CPP" checked style="width: auto;"> C++
                    </label>
                    <label style="display: flex; align-items: center; gap: 0.5rem; font-weight: 400; color: var(--text-color); cursor: pointer;">
                        <input type="radio" name="lang" value="PY" style="width: auto;"> Python
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Plik</label>

                <div class="file-input-wrapper">
                    <label for="fileInput" id="upload-label" class="custom-file-upload">Wybierz plik</label>
                    <input type="file" id="fileInput" onchange="handleFile(event)" style="display:none">
                    
                    <span id="file-name-info"></span>
                    <button type="button" id="clear-file" class="btn-x" style="display: none;" onclick="clearFile()" title="Usuń plik">✕</button>
                </div>
            </div>

            <div class="form-group">
                <label for="code">Kod</label>
                <textarea id="code" rows="10" style="font-size: 13px;" placeholder="Wklej swój kod tutaj..."></textarea>
            </div>

            <input type="hidden" name="code" id="hidden-code">

            <div>
                <button type="submit" style="width: 100%;">Zgłoś rozwiązanie</button>
                {% if error %}
                    <p class="error mt-4">{{ error }}</p>
                {% endif %}
            </div>
        </form>
    </div>
{% endblock %}

{% block scripts %}
    <script>
    function handleFile(e) {
        const file = e.target.files[0];
        const codeArea = document.getElementById('code');
        const hiddenCode = document.getElementById('hidden-code');
        const clearBtn = document.getElementById('clear-file');
        const fileInfo = document.getElementById('file-name-info');
        const uploadLabel = document.getElementById('upload-label');
        
        if (!file) {
            clearFile();
            return;
        }

        if (file.size >= 100 * 1024) {
            alert("Plik jest za duży (maksimum 100KB).");
            clearFile();
            return;
        }

        const reader = new FileReader();
        reader.onload = ev => {
            const content = ev.target.result;
            if (content.includes('\0')) {
                alert("Plik zawiera niedozwolone znaki i może być nieprawidłowy.");
                clearFile();
                return;
            }
            hiddenCode.value = content;
            codeArea.disabled = true;
            
            fileInfo.textContent = file.name;
            fileInfo.style.display = "block";
            clearBtn.style.display = "inline-flex";
            uploadLabel.style.display = "none";
        };
        reader.onerror = () => alert('Błąd odczytu pliku.');
        reader.readAsText(file);
    }

    function clearFile() {
        const fileInput = document.getElementById('fileInput');
        const codeArea = document.getElementById('code');
        const hiddenCode = document.getElementById('hidden-code');
        const clearBtn = document.getElementById('clear-file');
        const fileInfo = document.getElementById('file-name-info');
        const uploadLabel = document.getElementById('upload-label');

        fileInput.value = "";
        hiddenCode.value = "";
        codeArea.disabled = false;
        
        fileInfo.style.display = "none";
        clearBtn.style.display = "none";
        uploadLabel.style.display = "inline-block";
    }

    function prepareSubmit(event) {
        const codeArea = document.getElementById('code');
        const hiddenCode = document.getElementById('hidden-code');
        
        if (!hiddenCode.value) {
            hiddenCode.value = codeArea.value;
        }

        const codeContent = hiddenCode.value;
        
        if (codeContent.includes('\0')) {
            event.preventDefault();
            alert("Kod nie może zawierać bajtów zerowych (null bytes).");
            return false;
        }

        const size = new TextEncoder().encode(codeContent).length;

        if (size === 0) {
            event.preventDefault();
            alert("Kod nie może być pusty.");
            return false;
        }
        
        if (size >= 100 * 1024) {
            event.preventDefault();
            alert("Kod jest za duży (maksimum 100KB).");
            return false;
        }
    }
    </script>
{% endblock %}
