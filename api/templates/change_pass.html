{% extends "base.html" %}

{% block title %}Zmień hasło - {{ website }}{% endblock %}

{% block content %}

    <div class="card" style="max-width: 500px; margin: 0 auto;">
        <h1>Zmień hasło</h1>

        <form method="POST" action="/change-password">
            <div class="form-group">
                <label for="current_password">Obecne hasło</label>
                <input type="password" id="current_password" name="current_password" required>
            </div>
            <div class="form-group">
                <label for="new_password">Nowe hasło</label>
                <input type="password" id="new_password" name="new_password" required minlength="8">
            </div>
            <div class="form-group">
                <label for="confirm_password">Potwierdź nowe hasło</label>
                <input type="password" id="confirm_password" name="confirm_password" required minlength="8">
            </div>
            <button type="submit" style="width: 100%; margin-top: 1rem;">Zmień hasło</button>
        </form>

        {% if error %}
            <p class="error mt-4">{{ error }}</p>
        {% endif %}
        {% if success %}
            <p class="success mt-4">{{ success }}</p>
        {% endif %}
    </div>
{% endblock %}
